name: Release

# Publishing is gated: a tag only becomes a release after the full test suite
# and the live smoke checks pass. Use the manual trigger to (re)build and
# attach binaries for a tag that is already released.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach binaries to
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Check the tag matches package.json
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          expected="v$(bun -e 'console.log(require("./package.json").version)')"
          if [ "$tag" != "$expected" ]; then
            echo "Tag $tag does not match package.json version ($expected)." >&2
            exit 1
          fi
      - run: bun run check
      - run: bun run lint
      - run: bun run knip
      - run: bun test

  smoke:
    name: Smoke
    needs: verify
    uses: ./.github/workflows/smoke.yml
    secrets: inherit

  publish:
    name: Publish
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build executables
        run: |
          mkdir -p dist
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            bun build src/main.ts --compile --target="bun-$target" \
              --outfile "dist/tinyrouter-$target"
          done
          cd dist && sha256sum tinyrouter-* > SHA256SUMS
      - name: Verify the native executable runs
        run: |
          chmod +x dist/tinyrouter-linux-x64
          actual=$(dist/tinyrouter-linux-x64 --version)
          expected="${{ inputs.tag || github.ref_name }}"
          if [ "v$actual" != "$expected" ]; then
            echo "Executable reports $actual, expected ${expected#v}." >&2
            exit 1
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" --title "$tag" --generate-notes dist/* \
              --repo "$GITHUB_REPOSITORY"
          fi
