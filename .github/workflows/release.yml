name: Release

# Publishing is gated: a tag only becomes a release after the full test suite
# and the live smoke checks pass. Use the manual trigger to (re)build and
# attach binaries for a tag that is already released.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach binaries to
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Check the tag matches package.json
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          expected="v$(bun -e 'console.log(require("./package.json").version)')"
          if [ "$tag" != "$expected" ]; then
            echo "Tag $tag does not match package.json version ($expected)." >&2
            exit 1
          fi
      - run: bun run check
      - run: bun run lint
      - run: bun run knip
      - run: bun test

  smoke:
    name: Smoke
    needs: verify
    uses: ./.github/workflows/smoke.yml
    secrets: inherit
    with:
      ref: ${{ inputs.tag || github.ref }}

  container:
    name: Container
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A prerelease gets its exact version only; it must never move `latest`
      # or the minor tag that deployments track.
      - name: Compute image tags
        id: tags
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          version="${tag#v}"
          tags="${image}:${version}"
          case "$version" in
            *-*) ;;
            *) tags="${tags},${image}:${version%.*},${image}:latest" ;;
          esac
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
        env:
          tag: ${{ inputs.tag || github.ref_name }}
      # An image can build cleanly and still fail to start, so load a
      # single-architecture build and run it before publishing anything.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tinyrouter:candidate
      - name: Verify the image starts
        run: |
          actual=$(docker run --rm tinyrouter:candidate --version)
          expected="${tag#v}"
          if [ "$actual" != "$expected" ]; then
            echo "Image reports $actual, expected $expected." >&2
            exit 1
          fi
        env:
          tag: ${{ inputs.tag || github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.tag || github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0

  publish:
    name: Publish
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Archives rather than bare executables: extracting with tar does not
      # propagate macOS's quarantine flag, so a downloaded build is not
      # reported as damaged. They also cut the download by roughly two thirds.
      # Names are unversioned so the /releases/latest/download/ URLs stay
      # stable, and each archive holds a single executable named `tinyrouter`.
      - name: Build executables
        run: |
          mkdir -p dist build
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            bun build src/main.ts --compile --target="bun-$target" \
              --outfile build/tinyrouter
            chmod +x build/tinyrouter
            tar -czf "dist/tinyrouter-$target.tar.gz" -C build tinyrouter
            rm build/tinyrouter
          done
          cd dist && sha256sum tinyrouter-*.tar.gz > SHA256SUMS
      - name: Verify the native archive
        run: |
          tar -xzf dist/tinyrouter-linux-x64.tar.gz -C build
          actual=$(build/tinyrouter --version)
          expected="${{ inputs.tag || github.ref_name }}"
          if [ "v$actual" != "$expected" ]; then
            echo "Executable reports $actual, expected ${expected#v}." >&2
            exit 1
          fi
          for target in linux-arm64 darwin-x64 darwin-arm64; do
            contents=$(tar -tzf "dist/tinyrouter-$target.tar.gz")
            if [ "$contents" != "tinyrouter" ]; then
              echo "tinyrouter-$target.tar.gz contains '$contents', expected a single tinyrouter." >&2
              exit 1
            fi
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" --title "$tag" --generate-notes dist/* \
              --repo "$GITHUB_REPOSITORY"
          fi
