name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run knip
      - run: bun test
      - run: bun run build
      - run: ./dist/tinyrouter --version
      # The release publishes this image, so a broken Dockerfile should fail
      # here rather than after a tag has already been cut.
      - run: docker build -t tinyrouter:ci .
      - run: docker run --rm tinyrouter:ci --version
      # tinyrouter.dev serves the install script from main the moment it
      # merges, with no release in between, so check it here: lint it, then
      # install the latest release with it and run what it unpacked.
      - run: shellcheck --shell=sh site/install.sh
      - name: Install script
        run: |
          dir="$(mktemp -d)"
          TINYROUTER_INSTALL_DIR="$dir" sh site/install.sh
          "$dir/tinyrouter" --version
