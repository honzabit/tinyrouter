name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run knip
      - run: bun test
      - run: bun run build
      - run: ./dist/tinyrouter --version
      # The release publishes this image, so a broken Dockerfile should fail
      # here rather than after a tag has already been cut.
      - run: docker build -t tinyrouter:ci .
      - run: docker run --rm tinyrouter:ci --version
