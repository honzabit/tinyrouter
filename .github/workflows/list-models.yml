name: List models

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Gemini candidates
        run: |
          for model in gemini-flash-latest gemini-3.6-flash gemini-3.5-flash gemini-3-flash-preview; do
            code=$(curl -s -o /tmp/out.json -w '%{http_code}' \
              -H "x-goog-api-key: $GEMINI_API_KEY" -H 'content-type: application/json' \
              "https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent" \
              -d '{"contents":[{"role":"user","parts":[{"text":"say pong"}]}]}')
            printf '%-28s %s\n' "$model" "$code"
          done
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
