server:
  host: 0.0.0.0
  port: 8080
  api_key: ${TINYROUTER_API_KEY}
  idle_timeout_seconds: 0

routing:
  retries: 0
  retry_statuses: [429, 500, 502, 503, 504, 529]
  # Retries of the same target wait for the provider's Retry-After when sent,
  # otherwise an exponential jittered delay; a single wait never exceeds
  # backoff_max_ms. Fallback to the next target is always immediate.
  backoff_initial_ms: 200
  backoff_max_ms: 2000

# Optional deterministic request filters, applied in order per attempted
# provider. A filter with a providers list applies only to those providers,
# so local targets can stay unfiltered. See "Request filters" in the README
# for the built-in pattern names.
# filters:
#   - type: block
#     patterns: [anthropic_api_key, openai_api_key, aws_access_key, private_key]
#   - type: redact
#     patterns: [email]
#     providers: [openai, anthropic, gemini]

providers:
  openai:
    type: openai
    api_key: ${OPENAI_API_KEY}
    # Bounds provider progress: this long for response headers, then this long
    # again for each gap between body chunks. A slow model is fine; a silent
    # provider is cut loose instead of hanging the client.
    timeout_ms: 60000

  anthropic:
    type: anthropic
    api_key: ${ANTHROPIC_API_KEY}
    timeout_ms: 60000

  gemini:
    type: gemini
    api_key: ${GEMINI_API_KEY}
    timeout_ms: 60000

# Model IDs are passed to the provider verbatim and differ by account. If a
# target returns 404, list what your key can reach - see "Finding model IDs"
# in the README.
routes:
  fast:
    - openai/gpt-5-mini
    - anthropic/claude-haiku-4-5

  smart:
    - anthropic/claude-sonnet-4-6
    - openai/gpt-5.2

  economical:
    - gemini/gemini-3.6-flash
    - openai/gpt-5-mini
